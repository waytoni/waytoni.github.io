  <script>
    document.addEventListener('DOMContentLoaded', function () {
        const playerContainer = document.getElementById('video-player-container');
        const iframe = document.getElementById('main-video-iframe');
        const titleDisplay = document.getElementById('current-video-title');

        function playVideo(urlStr, title) {
            const url = new URL(urlStr);
            const videoId = url.searchParams.get('v');
            
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            titleDisplay.innerHTML = `${title} <a href="${urlStr}" target="_blank" style="font-size:1.0rem; margin-left:10px; color:#ff0;">[YouTube Link]</a>`;
            playerContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Attach to thumbnails
        const videoLinks = document.querySelectorAll('a.video-link');
        videoLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                // Get title from the associated h3
                const titleNode = this.closest('.video-card').querySelector('h3');
                const title = titleNode ? titleNode.textContent : 'පරමාර්ථ ධර්ම දේශනා';
                playVideo(this.href, title);
            });
        });

        // Attach to titles
        const titleLinks = document.querySelectorAll('a.video-link-title');
        titleLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const thumbLink = this.closest('.video-card').querySelector('a.video-link');
                if (thumbLink) {
                    playVideo(thumbLink.href, this.textContent);
                }
            });
        });
    });
  </script>
